<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=./frontend/index.html" />
    <meta name="theme-color" content="#0A0D12" />
    <title>ACTLA - Centinela</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0d12;
        --panel: #131a22;
        --text: #eef5ff;
        --muted: #9fb7d1;
        --accent: #4bd78d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1a2738 0%, var(--bg) 52%);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      .card {
        background: rgba(19, 26, 34, 0.96);
        border: 1px solid rgba(75, 215, 141, 0.3);
        border-radius: 18px;
        padding: 24px 28px;
        text-align: center;
        box-shadow: 0 18px 50px rgba(0,0,0,0.28);
      }
      .badge {
        display: inline-block;
        background: rgba(75, 215, 141, 0.15);
        border: 1px solid rgba(75, 215, 141, 0.45);
        color: var(--accent);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(1.6rem, 3vw, 2.5rem);
        margin: 18px 0 10px;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">ACTLA</div>
      <h1>Cargando Centinela…</h1>
      <p>Si no se redirige, abre <a href="./frontend/index.html">la app de ACTLA</a>.</p>
    </div>
    <script>
      window.location.replace('./frontend/index.html');
    </script>
  </body>
</html>
